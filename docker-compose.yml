services:
  postgres:
    image: postgres:17-alpine
    container_name: ft-warsaw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ft42}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ft42}
      POSTGRES_DB: ${POSTGRES_DB:-ft42_dashboard}
      # The campus timezone: day/week boundaries in the forecast queries are
      # campus-local, and Postgres is where several of them are computed.
      TZ: Europe/Warsaw
      PGTZ: Europe/Warsaw
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ft42} -d ${POSTGRES_DB:-ft42_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
